<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECAPAFlow — Supertonic Voice Builder</title>
<style>
/* Local fonts (extracted from the design bundle — fully on-device, no CDN).
   Outfit and JetBrains Mono are variable fonts: one file covers all weights. */
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("/static/fonts/jbmono-cyrillic-ext.woff2") format('woff2');
  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("/static/fonts/jbmono-cyrillic.woff2") format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("/static/fonts/jbmono-greek.woff2") format('woff2');
  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("/static/fonts/jbmono-vietnamese.woff2") format('woff2');
  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("/static/fonts/jbmono-latin-ext.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("/static/fonts/jbmono-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Outfit';
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url("/static/fonts/outfit-latin-ext.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Outfit';
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url("/static/fonts/outfit-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

@keyframes stbPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
@keyframes stbBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
@keyframes stbSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
body { margin: 0; background: #060606; -webkit-font-smoothing: antialiased; }
.stb-scrollx::-webkit-scrollbar { height: 6px; }
.stb-scrollx::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 999px; }
.stb-scrollx::-webkit-scrollbar-track { background: transparent; }

/* style-hover equivalents from the design source */
.hov-white:hover { border-color: #ffffff !important; }
.hov-border35:hover { border-color: rgba(255,255,255,0.35) !important; }
.hov-text:hover { color: #f6f6f2 !important; }
.hov-bright:hover { filter: brightness(1.08); }

textarea::placeholder { color: #5a5a54; }
button { font-family: inherit; }
input { font-family: inherit; }
</style>
</head>
<body>
<div id="root" style="font-family: 'Outfit', sans-serif; background: #060606; color: #f6f6f2; min-height: 100vh; overflow-x: hidden;">

  <section id="generation-panel" style="padding: 56px 40px; max-width: 900px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; position: relative; z-index: 1;">

    <div id="voice-tabs" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; padding-bottom: 6px;"></div>

    <div id="empty-state" style="display: none; text-align: center; padding: 70px 20px; border: 1px dashed rgba(255,255,255,0.16); border-radius: 20px;">
      <div style="font-size: 21px; font-weight: 600; color: #f0f0ec; margin-bottom: 10px;">No voice selected</div>
      <div style="font-size: 15px; color: #a8a8a0; line-height: 1.5;">Upload or record a short reference clip above to create your first voice tab.</div>
    </div>

    <div id="main-panel" style="display: none;">

      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #c2c2ba; font-weight: 500; margin-bottom: 22px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#c2c2ba"></path></svg>
        Supertonic 3 | Lightning Fast, On-Device, 31-Language TTS
        <span id="engine-status" style="margin-left: auto; font-size: 12px; color: #74746c; font-family: 'JetBrains Mono', monospace; white-space: nowrap;"></span>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px;">
        <div id="title-block" style="display: flex; align-items: center; gap: 12px;"></div>
        <button id="source-btn" class="hov-border35" style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: #0e0e0e; color: #d8d8d2; font-size: 14px; font-family: inherit; cursor: pointer;">
          <span id="source-label">Source Voice 0:00</span>
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center;">
            <span id="source-icon"></span>
          </span>
        </button>
      </div>

      <div>
        <div id="script-frame" style="border-left: 3px solid #FFFFFF; padding-left: 24px; min-height: 220px; display: flex; align-items: center;">
          <textarea id="script" rows="5" maxlength="100000" placeholder="Type or paste the text you want to hear..." style="width: 100%; background: transparent; border: none; outline: none; resize: none; font-family: inherit; font-size: 25px; line-height: 1.5; color: #f0f0ec;"></textarea>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 24px; padding-top: 20px;">
          <div style="display: flex; align-items: center; gap: 26px; flex-wrap: wrap;">
            <span id="content-types" style="display: contents;"></span>
            <div style="position: relative;">
              <div id="lang-toggle" style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: #d8d8d2; cursor: pointer;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><line x1="3" y1="12" x2="21" y2="12"></line><path d="M12 3a14.5 14.5 0 0 1 0 18a14.5 14.5 0 0 1 0-18z"></path></svg>
                <span id="lang-name">English</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <div id="lang-menu" style="display: none; position: absolute; top: calc(100% + 10px); left: 0; background: #141414; border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 6px; min-width: 170px; max-height: 260px; overflow-y: auto; z-index: 10; box-shadow: 0 12px 32px rgba(0,0,0,0.5);"></div>
            </div>
          </div>
          <div style="font-size: 13px; color: #74746c; font-family: 'JetBrains Mono', monospace;"><span id="char-count">0</span>/100000</div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 28px;">
          <div id="mode-buttons" style="display: inline-flex; gap: 8px; flex-wrap: wrap;"></div>
          <div style="display: inline-flex; gap: 8px; flex-wrap: wrap;">
            <button id="norm-toggle" class="hov-border35" title="Text normalizer: Fast (German/English regex rules) or Quality (adds correct numbers, dates, currency, ordinals and units in nine languages)" style="display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: #0e0e0e; color: #d8d8d2; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap;">
              <span id="norm-dot" style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25);"></span>
              <span id="norm-label">Text: Fast</span>
            </button>
            <button id="natural-toggle" class="hov-border35" title="Natural speech: punctuation-length pauses, breaths, room tone, de-clicked seams, per-sentence rate variation" style="display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: #0e0e0e; color: #d8d8d2; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap;">
              <span id="natural-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #f6f6f2;"></span>
              <span id="natural-label">Natural ON</span>
            </button>
            <button id="master-toggle" class="hov-border35" title="Studio chain: high-pass, de-esser, presence shelf, soft compression, tiny-room reverb, auto level" style="display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: #0e0e0e; color: #d8d8d2; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap;">
              <span id="master-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #f6f6f2;"></span>
              <span id="master-label">Studio ON</span>
            </button>
            <button id="auto-voice-toggle" class="hov-border35" title="Auto Voice: use a voice you've tagged for each paragraph's language, instead of always the selected voice" style="display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: #0e0e0e; color: #d8d8d2; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap;">
              <span id="auto-voice-dot" style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25);"></span>
              <span id="auto-voice-label">Auto Voice OFF</span>
            </button>
            <button id="stream-toggle" class="hov-border35" title="Streaming: playback starts instantly while the rest is still generating" style="display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: #0e0e0e; color: #d8d8d2; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap;">
              <span id="stream-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #f6f6f2;"></span>
              <span id="stream-label">Streaming ON</span>
            </button>
          </div>
        </div>

        <div id="sliders" style="display: flex; align-items: flex-end; gap: 52px; flex-wrap: wrap; margin-top: 24px;"></div>

        <div id="clone-section" style="margin-top: 30px; border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 20px 22px; background: rgba(255,255,255,0.02);">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px;">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a8a8a0; font-weight: 500;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
              Voice Cloning
            </div>
            <div id="clone-status" style="font-size: 12px; color: #74746c; font-family: 'JetBrains Mono', monospace;"></div>
          </div>
          <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; flex-wrap: wrap;">
            <div id="clone-sliders" style="display: flex; align-items: flex-end; gap: 52px; flex-wrap: wrap;"></div>
            <button id="clone-btn" class="hov-bright" style="padding: 15px 32px; background: #FFFFFF; border: none; border-radius: 11px; color: #0a0a0a; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;">Clone Voice</button>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 30px;">
          <button id="regen-btn" class="hov-white" style="padding: 15px 26px; background: transparent; border: 1px solid rgba(255,255,255,0.35); border-radius: 11px; color: #f6f6f2; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px; white-space: nowrap;">
            <span id="regen-spinner" style="display: none; line-height: 0;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="animation: stbSpin 0.8s linear infinite; display: block;"><circle cx="12" cy="12" r="9" stroke-dasharray="42 14"></circle></svg>
            </span>
            <span id="regen-label">Regenerate</span>
          </button>

          <div style="display: flex; align-items: center; gap: 14px; flex: 1; min-width: 220px;">
            <button id="result-play-btn" class="hov-white" style="width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
              <span id="result-icon"></span>
            </button>
            <div id="result-current" style="font-size: 13px; color: #74746c; font-family: 'JetBrains Mono', monospace;">0:00</div>
            <div style="flex: 1; height: 4px; background: rgba(255,255,255,0.14); border-radius: 999px; position: relative;">
              <div id="result-buffered" style="position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: rgba(255,255,255,0.32); border-radius: 999px;"></div>
              <div id="result-progress" style="position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #FFFFFF; border-radius: 999px;"></div>
            </div>
            <div id="result-duration" style="font-size: 13px; color: #74746c; font-family: 'JetBrains Mono', monospace;">0:01</div>
            <span id="result-rtf" style="display: none; font-size: 12px; color: #74746c; font-family: 'JetBrains Mono', monospace; white-space: nowrap;"></span>
            <button id="download-btn" class="hov-white" title="Download WAV" style="display: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); background: transparent; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #f6f6f2;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <div id="toast" style="display: none; position: fixed; bottom: 28px; right: 28px; background: #141414; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 16px 20px; max-width: 320px; font-size: 14px; color: #f0f0ec; box-shadow: 0 16px 40px rgba(0,0,0,0.5); z-index: 100;"></div>

  <input id="file-input" type="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.json" style="display: none;">
</div>

<script src="/static/app.js"></script>
</body>
</html>
